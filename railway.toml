# Railway can't access internal databases during build, so we move
# npm run migrate from build to start command
[build]
# domainPrisma is imported during Keystone config evaluation, so a clean
# install needs its Prisma client generated before Keystone can load.
buildCommand = "prisma generate && keystone build --no-ui && next build"

[deploy]
startCommand = "npm run migrate && next start"
